name: Wedstrijdaankondigingen versturen

# Draait elke 15 minuten (de venstermarge in reminder_sync.py is 10 minuten,
# dus dit interval is krap genoeg om het 24u-moment nooit te missen) en is
# ook handmatig te starten via "Run workflow".
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # nodig om data/reminders_verzonden.json terug te committen

jobs:
  reminder-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aankondigingen versturen
        env:
          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
          APP_URL: https://ajaxpoule.pythonanywhere.com
        run: python scripts/reminder_sync.py
