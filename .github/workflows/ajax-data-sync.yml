name: Ajax-data synchroniseren

# Wordt periodiek getriggerd door een EXTERNE cron-dienst (cron-job.org),
# die via de GitHub API workflow_dispatch aanroept -- niet langer via
# GitHub's eigen 'schedule:'. Reden: GitHub's ingebouwde planning is
# officieel "best effort" en bleek in de praktijk soms urenlang stil te
# vallen (gedocumenteerd GitHub-platformgedrag, geen fout in deze workflow).
#
# De 'force_refresh'-input maakt onderscheid tussen:
#  - een bewuste handmatige klik op "Run workflow" in de GitHub-UI
#    (standaard AAN: forceert altijd een volledige ververing)
#  - de externe, routinematige cron-aanroep (stuurt expliciet UIT mee, zodat
#    alleen ververst wordt wanneer dat ook daadwerkelijk nodig is)
#
# LET OP — nog steeds relevant ondanks de externe trigger: GitHub schakelt
# workflows automatisch uit na 60 dagen zonder repository-activiteit
# (commits/PR's). Zolang je actief aan de site werkt is dat geen probleem.
on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Forceer een volledige ververing (aan = handmatige controle, uit = routinematige cyclus)'
        type: boolean
        default: true

permissions:
  contents: write   # nodig om data/ajax_schedule.json terug te committen

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies installeren
        run: pip install requests

      - name: Ajax-data ophalen en tabel bijwerken
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh }}
        run: python scripts/ajax_data_sync.py

      - name: Wijzigingen committen (alleen als er echt iets veranderde)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ajax_schedule.json
          git diff --staged --quiet || git commit -m "Ajax-data bijgewerkt [skip ci]"
          # git pull --rebase vlak vóór de push: er draaien meerdere workflows
          # (nieuws-sync, reminder-sync) die onafhankelijk van elkaar naar
          # dezelfde main-branch committen. Zonder dit zou een gelijktijdige
          # push van een andere workflow deze push laten mislukken
          # ('! [rejected] ... fetch first').
          git pull --rebase --autostash
          git push
