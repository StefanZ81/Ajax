{% extends "base.html" %}
{% block content %}
<div style="text-align:center; margin: 32px 0;">
  <img src="{{ url_for('static', filename='ajax_logo.png') }}" alt="Ajax" style="width:64px; height:64px; margin: 0 auto 12px; display:block;">
  <h1 style="margin:0;">J-POULE</h1>
  <p style="color:var(--grey); font-size:13px;">Besloten Ajax-voetbalpoule</p>
</div>

<div class="tabs-toggle">
  <a href="{{ url_for('login') }}" class="actief">Inloggen</a>
  <a href="{{ url_for('registreren') }}">Aanmelden</a>
</div>

<div class="card">
  <form method="post">
    <div class="veld">
      <label>E-mailadres</label>
      <input type="email" name="email" required>
    </div>
    <div class="veld">
      <label>Wachtwoord</label>
      <input type="password" name="wachtwoord" required>
    </div>
    <button type="submit">Inloggen</button>
  </form>
</div>

<p style="font-size:11px; color:var(--grey); text-align:center;">
  🔒 Je wachtwoord wordt versleuteld opgeslagen en is nooit leesbaar — ook niet voor de beheerder.
</p>
{% endblock %}
